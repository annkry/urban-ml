[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-ml"
version = "0.1.0"
description = "ML platform for urban intelligence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.139.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "polars>=1.43.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.50.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "vulture>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "pandas.*"]
ignore_missing_imports = true
